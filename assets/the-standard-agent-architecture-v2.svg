<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="790" viewBox="0 0 1480 790" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker>
  </defs>

  <rect width="1480" height="790" fill="#0a0d14"/>

  <text x="740" y="44" text-anchor="middle" fill="#e6edf3" font-size="25" font-weight="700">Agent = Orchestration(Data, Decision, Direction)</text>
  <text x="740" y="70" text-anchor="middle" fill="#8b949e" font-size="13.5">every service holds 2–3 dependencies · each region is one concept · each foundation wraps exactly one broker</text>

  <!-- tier labels -->
  <text x="24" y="152" fill="#6e7681" font-size="11.5" font-weight="700" letter-spacing="1.4">MANAGEMENT</text>
  <text x="24" y="168" fill="#4a5261" font-size="10.5">the loop</text>
  <text x="24" y="238" fill="#6e7681" font-size="11.5" font-weight="700" letter-spacing="1.4">COORDINATION</text>
  <text x="24" y="254" fill="#4a5261" font-size="10.5">the three natures</text>
  <text x="24" y="332" fill="#6e7681" font-size="11.5" font-weight="700" letter-spacing="1.4">ORCHESTRATION</text>
  <text x="24" y="348" fill="#4a5261" font-size="10.5">six regions</text>
  <text x="24" y="424" fill="#6e7681" font-size="11.5" font-weight="700" letter-spacing="1.4">FOUNDATION</text>
  <text x="24" y="440" fill="#4a5261" font-size="10.5">one broker each</text>
  <text x="24" y="622" fill="#6e7681" font-size="11.5" font-weight="700" letter-spacing="1.4">BROKER</text>

  <!-- MANAGEMENT -->
  <rect x="560" y="118" width="360" height="54" rx="10" fill="#161b26" stroke="#e6edf3" stroke-width="1.6"/>
  <text x="740" y="141" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Agent Management Service</text>
  <text x="740" y="159" text-anchor="middle" fill="#8b949e" font-size="11.5">Recall → Think → Act · sequencing only</text>

  <path d="M 660 172 V 190 H 380 V 203" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M 740 172 V 203" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M 820 172 V 190 H 1240 V 203" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- COORDINATION -->
  <rect x="175" y="204" width="410" height="58" rx="10" fill="#111722" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="380" y="228" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Data Coordination</text>
  <text x="380" y="247" text-anchor="middle" fill="#8b949e" font-size="11.5">what the agent HAS</text>

  <rect x="605" y="204" width="410" height="58" rx="10" fill="#111722" stroke="#f0883e" stroke-width="1.8"/>
  <text x="810" y="228" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Decision Coordination</text>
  <text x="810" y="247" text-anchor="middle" fill="#8b949e" font-size="11.5">what the agent DECIDES</text>

  <rect x="1035" y="204" width="410" height="58" rx="10" fill="#111722" stroke="#3fb950" stroke-width="1.8"/>
  <text x="1240" y="228" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Direction Coordination</text>
  <text x="1240" y="247" text-anchor="middle" fill="#8b949e" font-size="11.5">what the agent DOES</text>

  <path d="M 300 262 V 276 H 274 V 297" fill="none" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#ab)"/>
  <path d="M 460 262 V 276 H 486 V 297" fill="none" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#ab)"/>
  <path d="M 730 262 V 276 H 704 V 297" fill="none" stroke="#f0883e" stroke-width="1.4" marker-end="url(#ao)"/>
  <path d="M 890 262 V 276 H 916 V 297" fill="none" stroke="#f0883e" stroke-width="1.4" marker-end="url(#ao)"/>
  <path d="M 1160 262 V 276 H 1134 V 297" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 1320 262 V 276 H 1346 V 297" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ag)"/>

  <!-- ORCHESTRATION (regions) -->
  <rect x="175" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="274" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Retrieval</text>
  <text x="274" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">authored, ranked by relevance</text>

  <rect x="387" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="486" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Recollection</text>
  <text x="486" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">accumulated, replayed</text>

  <rect x="605" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="704" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Thinking</text>
  <text x="704" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">the model call, and its boundary</text>

  <rect x="817" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="916" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Guarding</text>
  <text x="916" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">a conscience, before and after</text>

  <rect x="1035" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1134" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Perimeter</text>
  <text x="1134" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">may it happen, has it already?</text>

  <rect x="1247" y="298" width="198" height="60" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1346" y="321" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">Acting</text>
  <text x="1346" y="339" text-anchor="middle" fill="#8b949e" font-size="10.5">perform it, or answer</text>

  <!-- FOUNDATION -->
  <g font-size="12.5">
    <!-- Retrieval -->
    <rect x="175" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="274" y="423" text-anchor="middle" fill="#c9d1d9">Skill Service</text>
    <rect x="175" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="274" y="471" text-anchor="middle" fill="#c9d1d9">Knowledge Service</text>
    <!-- Recollection -->
    <rect x="387" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="486" y="423" text-anchor="middle" fill="#c9d1d9">Memory Service</text>
    <rect x="387" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#a371f7" stroke-dasharray="4 3"/><text x="480" y="471" text-anchor="middle" fill="#c9d1d9">Session Service</text><text x="566" y="470" text-anchor="middle" fill="#a371f7" font-size="9.5">FULL</text>
    <!-- Thinking -->
    <rect x="605" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="704" y="423" text-anchor="middle" fill="#c9d1d9">Brain Service</text>
    <rect x="605" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#a371f7" stroke-dasharray="4 3"/><text x="698" y="471" text-anchor="middle" fill="#c9d1d9">Redaction Service</text><text x="784" y="470" text-anchor="middle" fill="#a371f7" font-size="9.5">FULL</text>
    <!-- Guarding -->
    <rect x="817" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="916" y="423" text-anchor="middle" fill="#c9d1d9">Gate Service</text>
    <rect x="817" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="916" y="471" text-anchor="middle" fill="#c9d1d9">Judge Service</text>
    <!-- Perimeter -->
    <rect x="1035" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#a371f7" stroke-dasharray="4 3"/><text x="1128" y="423" text-anchor="middle" fill="#c9d1d9">Policy Service</text><text x="1214" y="422" text-anchor="middle" fill="#a371f7" font-size="9.5">FULL</text>
    <rect x="1035" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#a371f7" stroke-dasharray="4 3"/><text x="1128" y="471" text-anchor="middle" fill="#c9d1d9">Approval Service</text><text x="1214" y="470" text-anchor="middle" fill="#a371f7" font-size="9.5">FULL</text>
    <rect x="1035" y="494" width="198" height="40" rx="8" fill="#0f1420" stroke="#a371f7" stroke-dasharray="4 3"/><text x="1128" y="519" text-anchor="middle" fill="#c9d1d9">Effect Ledger Service</text><text x="1214" y="518" text-anchor="middle" fill="#a371f7" font-size="9.5">FULL</text>
    <!-- Acting -->
    <rect x="1247" y="398" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="1346" y="423" text-anchor="middle" fill="#c9d1d9">Internal Tool Service</text>
    <rect x="1247" y="446" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="1346" y="471" text-anchor="middle" fill="#c9d1d9">External Tool Service</text>
    <rect x="1247" y="494" width="198" height="40" rx="8" fill="#0f1420" stroke="#2b3444"/><text x="1346" y="519" text-anchor="middle" fill="#c9d1d9">Return Service</text>
  </g>

  <!-- region → foundation connectors -->
  <g stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M 274 358 V 396" stroke="#58a6ff"/><path d="M 486 358 V 396" stroke="#58a6ff"/>
    <path d="M 704 358 V 396" stroke="#f0883e"/><path d="M 916 358 V 396" stroke="#f0883e"/>
    <path d="M 1134 358 V 396" stroke="#3fb950"/><path d="M 1346 358 V 396" stroke="#3fb950"/>
  </g>

  <text x="1445" y="556" text-anchor="end" fill="#565f6d" font-size="11">Return Service wraps no broker — it is the dead end</text>

  <!-- BROKER band -->
  <rect x="175" y="580" width="1270" height="88" rx="11" fill="#10141d" stroke="#2b3444" stroke-dasharray="6 5"/>
  <text x="199" y="606" fill="#e6edf3" font-size="13.5" font-weight="700">13 nature brokers</text>
  <text x="330" y="606" fill="#8b949e" font-size="12">— one beneath each foundation. Resilience and redaction-at-the-wire are <tspan fill="#c9d1d9">decorating brokers</tspan>: they wrap a call, they are not a resource.</text>

  <text x="199" y="638" fill="#e6edf3" font-size="13.5" font-weight="700">3 utility brokers</text>
  <rect x="320" y="622" width="112" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="376" y="639" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Logging</text>
  <rect x="442" y="622" width="112" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="498" y="639" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Time</text>
  <rect x="564" y="622" width="112" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="620" y="639" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Audit</text>
  <text x="692" y="639" fill="#8b949e" font-size="12">— observability, held by any tier. They depend on nothing, so no broker depends on a broker.</text>

  <line x1="175" y1="694" x2="1445" y2="694" stroke="#1f2733"/>
  <text x="175" y="722" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">Core is 1 · 3 · 9.</tspan> Drop the five FULL foundations and each nature holds exactly three — the natures collapse back to plain orchestrations and the tier disappears.</text>
  <text x="175" y="744" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">Full is 1 · 3 · 6 · 14.</tspan> The same three partitions, each split into two regions, because a nature that owns six foundations owns two concepts.</text>
  <text x="175" y="768" fill="#565f6d" font-size="11.5">Flow is forward only. No service reaches past the tier directly beneath it, and no foundation calls a sibling. <tspan fill="#a371f7">One crossing is deliberate:</tspan> Acting screens tool output through the Gate — one guardian, not two (§4.9).</text>
</svg>
