  <!-- utility brokers -->
  <rect x="30" y="862" width="1390" height="66" rx="11" fill="#10141d" stroke="#2b3444" stroke-dasharray="6 5"/>
  <text x="52" y="890" fill="#e6edf3" font-size="13" font-weight="700">4 utility brokers</text>
  <rect x="176" y="875" width="108" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="230" y="892" text-anchor="middle" fill="#c9d1d9" font-size="11.5">LoggingBroker</text>
  <rect x="292" y="875" width="90" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="337" y="892" text-anchor="middle" fill="#c9d1d9" font-size="11.5">TimeBroker</text>
  <rect x="390" y="875" width="94" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="437" y="892" text-anchor="middle" fill="#c9d1d9" font-size="11.5">AuditBroker</text>
  <rect x="492" y="875" width="118" height="26" rx="6" fill="#161b26" stroke="#2b3444"/><text x="551" y="892" text-anchor="middle" fill="#c9d1d9" font-size="11.5">ResilienceBroker</text>
  <text x="626" y="892" fill="#8b949e" font-size="11.5">— held by any tier, and they depend on nothing, so no broker depends on a broker.</text>
  <text x="52" y="918" fill="#8b949e" font-size="11.5">None of the four backs a nature: three observe a run, one modulates a call. That is what keeps them out of the 14 and off the 2–3 count.</text>

  <text x="30" y="962" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">Core is 1 · 3 · 9.</tspan> Drop the five FULL foundations and every nature holds exactly three — the regions and the coordination tier collapse, and the natures are plain orchestrations again.</text>
  <text x="30" y="984" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">Full is 1 · 3 · 6 · 14.</tspan> The same three partitions, each split in two, because a nature that owns six foundations owns two concepts.</text>
  <text x="30" y="1006" fill="#565f6d" font-size="11.5">No service reaches past the tier directly to its right, and no foundation calls a sibling. <tspan fill="#a371f7">Two shared dependencies:</tspan> both Decision regions redact, because §4.6 covers every model call; and Execution screens tool output through the Gate — one guardian, not two (§4.9).</text>
</svg>
