  <text x="725" y="42" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">Agent = Orchestration(Data, Decision, Direction)</text>
  <text x="725" y="68" text-anchor="middle" fill="#8b949e" font-size="13">Flow is forward only, left to right · 2–3 dependencies per service · one concept per region · one broker per foundation</text>

