  <rect x="348" y="869" width="96" height="24" rx="6" fill="#161b26" stroke="#2b3444"/><text x="396" y="885" text-anchor="middle" fill="#c9d1d9" font-size="11">AuditBroker</text>
  <text x="456" y="885" fill="#8b949e" font-size="11.5">— observability, held by any tier. None of them can change what the agent decides or does, which is exactly why they are exempt from the count.</text>

  <text x="52" y="912" fill="#e6edf3" font-size="13" font-weight="700">2 decorating</text>
  <rect x="150" y="897" width="116" height="24" rx="6" fill="#161b26" stroke="#2b3444"/><text x="208" y="913" text-anchor="middle" fill="#c9d1d9" font-size="11">RedactionBroker</text>
  <rect x="274" y="897" width="120" height="24" rx="6" fill="#161b26" stroke="#2b3444"/><text x="334" y="913" text-anchor="middle" fill="#c9d1d9" font-size="11">ResilienceBroker</text>
  <text x="406" y="913" fill="#8b949e" font-size="11.5">— wrapped around another broker at composition, so no service holds them. FileBroker is the Local resource behind Memory and Knowledge.</text>

  <text x="30" y="958" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">1 · 3 · 6 · 14.</tspan> Ten foundations are always there — the agent proper. Four arrive with the enterprise capabilities and are marked <tspan fill="#a371f7">FULL</tspan>; leave them off and it is the same shape with less in it.</text>
  <text x="30" y="980" fill="#8b949e" font-size="12.5"><tspan fill="#e6edf3" font-weight="700">Usage is why Decision has two regions.</tspan> Inference asks the model and reads its answer — measuring what that call cost is the same concept, and no budget can be enforced without it.</text>
  <text x="30" y="1000" fill="#565f6d" font-size="11.5">No service reaches past the tier directly to its right, and no foundation calls a sibling. <tspan fill="#a371f7">One known deviation:</tspan> DirectionCoordinationService still holds the Gate for <tspan fill="#8b949e">.ScreenToolOutput()</tspan> — tracked in docs/architecture-alignment.md.</text>
</svg>
