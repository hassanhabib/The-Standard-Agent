<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5261"/>
    </marker>
  </defs>

  <rect width="1360" height="1000" fill="#0a0d14"/>

  <text x="680" y="48" text-anchor="middle" fill="#e6edf3" font-size="27" font-weight="700">Agent = Orchestration(Data, Decision, Direction)</text>
  <text x="680" y="78" text-anchor="middle" fill="#8b949e" font-size="14">the 1 · 3 · 9  —  Coordination → Orchestration → Foundation → Broker</text>

  <!-- ============ Coordination ============ -->
  <rect x="30" y="398" width="200" height="50" rx="10" fill="#161b26" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="130" y="429" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Agent Builder</text>

  <rect x="300" y="398" width="200" height="50" rx="10" fill="#161b26" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="400" y="422" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Agent Coordination</text>
  <text x="400" y="440" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Service</text>

  <line x1="230" y1="423" x2="292" y2="423" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- coordination fan-out to the three natures -->
  <path d="M 500 423 H 536 V 207 H 564" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 536 423 H 564" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 500 423 H 536 V 639 H 564" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Orchestrations ============ -->
  <rect x="572" y="181" width="196" height="52" rx="10" fill="#161b26" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="203" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Data Orchestration</text>
  <text x="670" y="222" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Service</text>

  <rect x="572" y="397" width="196" height="52" rx="10" fill="#161b26" stroke="#f0883e" stroke-width="2"/>
  <text x="670" y="419" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Decision Orchestration</text>
  <text x="670" y="438" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Service</text>

  <rect x="572" y="613" width="196" height="52" rx="10" fill="#161b26" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="635" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Direction Orchestration</text>
  <text x="670" y="654" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Service</text>

  <!-- orchestration fan-out to foundations -->
  <path d="M 768 207 H 800 V 135 H 832" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M 800 207 H 832" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M 768 207 H 800 V 279 H 832" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <path d="M 768 423 H 800 V 351 H 832" fill="none" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 800 423 H 832" fill="none" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 768 423 H 800 V 495 H 832" fill="none" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <path d="M 768 639 H 800 V 567 H 832" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 800 639 H 832" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 768 639 H 800 V 711 H 832" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ============ Foundations + nature brokers ============ -->
  <!-- Data -->
  <rect x="840" y="111" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="123" width="4" height="24" rx="2" fill="#58a6ff"/>
  <text x="945" y="140" text-anchor="middle" fill="#e6edf3" font-size="14">Skills Service</text>
  <line x1="1040" y1="135" x2="1102" y2="135" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="111" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="140" text-anchor="middle" fill="#e6edf3" font-size="14">Skill Broker</text>

  <rect x="840" y="183" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="195" width="4" height="24" rx="2" fill="#58a6ff"/>
  <text x="945" y="212" text-anchor="middle" fill="#e6edf3" font-size="14">Memory Service</text>
  <line x1="1040" y1="207" x2="1102" y2="207" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="183" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="212" text-anchor="middle" fill="#e6edf3" font-size="14">Memory Broker</text>

  <rect x="840" y="255" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="267" width="4" height="24" rx="2" fill="#58a6ff"/>
  <text x="945" y="284" text-anchor="middle" fill="#e6edf3" font-size="14">Knowledge Service</text>
  <line x1="1040" y1="279" x2="1102" y2="279" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="255" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="284" text-anchor="middle" fill="#e6edf3" font-size="14">Knowledge Broker</text>

  <!-- Decision -->
  <rect x="840" y="327" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="339" width="4" height="24" rx="2" fill="#f0883e"/>
  <text x="945" y="356" text-anchor="middle" fill="#e6edf3" font-size="14">Gate Service</text>
  <line x1="1040" y1="351" x2="1102" y2="351" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="327" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="356" text-anchor="middle" fill="#e6edf3" font-size="14">Classifier Broker</text>

  <rect x="840" y="399" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="411" width="4" height="24" rx="2" fill="#f0883e"/>
  <text x="945" y="428" text-anchor="middle" fill="#e6edf3" font-size="14">Brain Service</text>
  <line x1="1040" y1="423" x2="1102" y2="423" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="399" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="420" text-anchor="middle" fill="#e6edf3" font-size="14">Generator Broker</text>
  <text x="1210" y="437" text-anchor="middle" fill="#8b949e" font-size="11">V0 text · V1 native calls</text>

  <rect x="840" y="471" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="483" width="4" height="24" rx="2" fill="#f0883e"/>
  <text x="945" y="500" text-anchor="middle" fill="#e6edf3" font-size="14">Judge Service</text>
  <line x1="1040" y1="495" x2="1102" y2="495" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="471" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="500" text-anchor="middle" fill="#e6edf3" font-size="14">Verifier Broker</text>

  <!-- Direction -->
  <rect x="840" y="543" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="555" width="4" height="24" rx="2" fill="#3fb950"/>
  <text x="945" y="572" text-anchor="middle" fill="#e6edf3" font-size="14">Internal Tools Service</text>
  <line x1="1040" y1="567" x2="1102" y2="567" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="543" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="572" text-anchor="middle" fill="#e6edf3" font-size="14">Tool Broker</text>

  <rect x="840" y="615" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="627" width="4" height="24" rx="2" fill="#3fb950"/>
  <text x="945" y="644" text-anchor="middle" fill="#e6edf3" font-size="14">External Tools Service</text>
  <line x1="1040" y1="639" x2="1102" y2="639" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1110" y="615" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <text x="1210" y="644" text-anchor="middle" fill="#e6edf3" font-size="14">Mcp Broker</text>

  <rect x="840" y="687" width="200" height="48" rx="9" fill="#161b26" stroke="#2b3444"/>
  <rect x="848" y="699" width="4" height="24" rx="2" fill="#3fb950"/>
  <text x="945" y="716" text-anchor="middle" fill="#e6edf3" font-size="14">Return Service</text>
  <rect x="1110" y="687" width="200" height="48" rx="9" fill="none" stroke="#39414f" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="1210" y="709" text-anchor="middle" fill="#6e7681" font-size="13">no broker</text>
  <text x="1210" y="726" text-anchor="middle" fill="#565f6d" font-size="11">the dead end — it touches nothing</text>

  <!-- ============ Support brokers ============ -->
  <rect x="300" y="790" width="1010" height="164" rx="12" fill="#10141d" stroke="#2b3444" stroke-dasharray="6 5"/>

  <text x="324" y="820" fill="#e6edf3" font-size="15" font-weight="700">Support brokers</text>
  <text x="460" y="820" fill="#8b949e" font-size="13">— reached from every tier. They serve a nature without backing one, so the 1 · 3 · 9 is unchanged.</text>

  <rect x="324" y="836" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="414" y="856" text-anchor="middle" fill="#e6edf3" font-size="13">Logging Broker</text>
  <text x="414" y="871" text-anchor="middle" fill="#8b949e" font-size="10.5">the trace, every tier</text>

  <rect x="518" y="836" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="608" y="856" text-anchor="middle" fill="#e6edf3" font-size="13">Audit Broker</text>
  <text x="608" y="871" text-anchor="middle" fill="#8b949e" font-size="10.5">append-only decision log</text>

  <rect x="712" y="836" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="802" y="856" text-anchor="middle" fill="#e6edf3" font-size="13">Policy Broker</text>
  <text x="802" y="871" text-anchor="middle" fill="#8b949e" font-size="10.5">authorizes an act</text>

  <rect x="906" y="836" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="996" y="856" text-anchor="middle" fill="#e6edf3" font-size="13">Approval Broker</text>
  <text x="996" y="871" text-anchor="middle" fill="#8b949e" font-size="10.5">a person, before the act</text>

  <rect x="1100" y="836" width="186" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="1193" y="856" text-anchor="middle" fill="#e6edf3" font-size="13">Effect Ledger Broker</text>
  <text x="1193" y="871" text-anchor="middle" fill="#8b949e" font-size="10.5">run once, across a crash</text>

  <rect x="324" y="890" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="414" y="910" text-anchor="middle" fill="#e6edf3" font-size="13">Session Broker</text>
  <text x="414" y="925" text-anchor="middle" fill="#8b949e" font-size="10.5">conversation, resumption</text>

  <rect x="518" y="890" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="608" y="910" text-anchor="middle" fill="#e6edf3" font-size="13">Redaction Broker</text>
  <text x="608" y="925" text-anchor="middle" fill="#8b949e" font-size="10.5">no model sees the value</text>

  <rect x="712" y="890" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="802" y="910" text-anchor="middle" fill="#e6edf3" font-size="13">Resilience Broker</text>
  <text x="802" y="925" text-anchor="middle" fill="#8b949e" font-size="10.5">retry, circuit breaker</text>

  <rect x="906" y="890" width="180" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="996" y="910" text-anchor="middle" fill="#e6edf3" font-size="13">Time Broker</text>
  <text x="996" y="925" text-anchor="middle" fill="#8b949e" font-size="10.5">one clock per run</text>

  <rect x="1100" y="890" width="186" height="42" rx="8" fill="#161b26" stroke="#2b3444"/>
  <text x="1193" y="910" text-anchor="middle" fill="#e6edf3" font-size="13">File Broker</text>
  <text x="1193" y="925" text-anchor="middle" fill="#8b949e" font-size="10.5">skills, knowledge, rubrics</text>

  <text x="30" y="978" fill="#565f6d" font-size="12">Flow is forward only. A tier never calls the tier above it.</text>
  <text x="1330" y="978" text-anchor="end" fill="#565f6d" font-size="12">9 foundations · 8 nature brokers · 10 support brokers</text>
</svg>
