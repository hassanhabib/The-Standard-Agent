name: Standard.Agents Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pulling Code
      uses: actions/checkout@v7

    # global.json pins the SDK, so CI and a developer's machine compile with the same one.
    # A version named in two places drifts in one of them. The 8.0 line below is a runtime,
    # not a second compiler: the package multi-targets net8.0, and the unit suite runs on
    # both targets, so the runner needs somewhere to run the net8.0 half.
    - name: Installing .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Restoring Packages
      run: dotnet restore

    # Warnings are errors (Directory.Build.props), so this step is also the zero-warning gate.
    - name: Building Solution
      run: dotnet build --no-restore --configuration Release

    - name: Running Tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    # Spec certification, not just unit tests. The vectors are the contract SPEC.md
    # defines; a green suite that no longer conforms is worth catching on the PR that
    # breaks it rather than on the next release.
    - name: Certifying Conformance
      run: dotnet run --project Standard.Agents.Conformance --no-build --configuration Release

    # The readiness level the package claims. SPEC.md §1.1: a claim whose evidence has not been
    # run is not a claim. This is what makes the badge in the README checkable by anyone.
    - name: Certifying Enterprise Profile
      run: >
        dotnet run --project Standard.Agents.Conformance --no-build --configuration Release
        -- --profile Enterprise

    # The highest level the README claims, certified explicitly. Critical inherits Enterprise,
    # so this transitively re-certifies every lower profile; running all vectors proves their
    # current behavior but not that each profile's required set is still complete (F-18).
    - name: Certifying Critical Profile
      run: >
        dotnet run --project Standard.Agents.Conformance --no-build --configuration Release
        -- --profile Critical

    # Quality certification beside contract certification: the golden evals measure task
    # completion, groundedness, retrieval precision and recall, tool selection, refusal
    # correctness and revision effectiveness, and fail the build under threshold.
    # Deterministic - scripted brains, no keys, no network.
    - name: Evaluating Quality
      run: dotnet run --project Standard.Agents.Evals --no-build --configuration Release

  # The same gate on the other operating system the package is used on. What varies most
  # across platforms is exactly what the file stores, the session lock, path handling and the
  # SSE wire exercise, and a suite proven on Ubuntu alone proves it there alone (principal
  # review 2026-09-04, F-28). Certifying Critical here re-certifies every profile below it.
  windows:
    runs-on: windows-latest

    steps:
    - name: Pulling Code
      uses: actions/checkout@v7

    - name: Installing .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Restoring Packages
      run: dotnet restore

    - name: Building Solution
      run: dotnet build --no-restore --configuration Release

    - name: Running Tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Certifying Conformance
      run: dotnet run --project Standard.Agents.Conformance --no-build --configuration Release

    - name: Certifying Critical Profile
      run: >
        dotnet run --project Standard.Agents.Conformance --no-build --configuration Release
        -- --profile Critical

    - name: Evaluating Quality
      run: dotnet run --project Standard.Agents.Evals --no-build --configuration Release

  supply-chain:
    runs-on: ubuntu-latest

    steps:
    # Full history: the secret scan diffs a commit against its parent, and the default shallow
    # clone has no parent to diff against — it fails to scan rather than finding nothing, which
    # is the failure mode a security check must never have.
    - name: Pulling Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Installing .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restoring Packages
      run: dotnet restore

    # A known-vulnerable transitive dependency is a finding whether or not anyone looked, so
    # look on every change rather than at release time when it is expensive to act on.
    - name: Auditing Dependencies For Vulnerabilities
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
        if grep -q "has the following vulnerable packages" audit.txt; then
          echo "::error::Vulnerable packages found — see the listing above."
          exit 1
        fi

    # A license inventory with a policy, not a package listing: every package in the shipped
    # graph, transitively, resolved to a license expression and checked against
    # licenses/allowed-licenses.json. Packages that publish only a URL are mapped in
    # licenses/license-url-mappings.json; the two that ship a bare License.txt are named in
    # licenses/package-overrides.json. An unknown or disallowed license fails the build (F-26).
    - name: Checking Dependency Licenses Against Policy
      run: |
        dotnet tool install --global nuget-license
        nuget-license -i Standard.Agents/Standard.Agents.csproj -t \
          -a licenses/allowed-licenses.json \
          -mapping licenses/license-url-mappings.json \
          -override licenses/package-overrides.json \
          -o JsonPretty -fo licenses.json
        nuget-license -i Standard.Agents/Standard.Agents.csproj -t \
          -a licenses/allowed-licenses.json \
          -mapping licenses/license-url-mappings.json \
          -override licenses/package-overrides.json \
          -err

    - name: Publishing The License Inventory
      uses: actions/upload-artifact@v4
      with:
        name: license-inventory
        path: licenses.json

    # Secrets that reach a public repository are already leaked; the value of this check is
    # catching the commit that would have done it.
    - name: Scanning For Secrets
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
